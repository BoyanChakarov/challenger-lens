[package]
name = "challenger-lens"
version = "0.2.0"
description = "Read-only League of Legends champion-select companion"
authors = ["Challenger Lens contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "challenger_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "sync"] }
